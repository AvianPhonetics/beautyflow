<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c9744f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BeautyFlow">
<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<base href="./">
<title>BeautyFlow — CRM для салона</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<!-- VK Bridge: только для VK Mini App. В браузере просто не сработает -->
<script src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js" onerror="window.__vkBridgeMissing=true"></script>
</head>
<body>

<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" id="brandMark">B</span>
        <span id="salonName">BeautyFlow</span>
      </div>
      <button class="icon-btn hidden" id="logoutBtn" aria-label="Выйти">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view">
    <div class="boot-loader">
      <div class="boot-spinner"></div>
      <div>Загрузка…</div>
    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Единый контейнер для всех модалок. Содержимое рендерит modals.js -->
<div id="modalRoot"></div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Точка входа -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
